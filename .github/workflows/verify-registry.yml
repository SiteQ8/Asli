name: Verify registry domains

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every listed official domain still resolves and answers
        id: check
        run: node tools/verify-domains.mjs --report report.md

      - name: Open an issue when a listed domain stops answering
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "A listed official domain stopped answering" \
            --label registry \
            --body-file report.md
