name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the tests
        run: node --test

      - name: Check that PROJECT.md and PROJECT.ar.md are up to date
        run: node tools/build-project-md.mjs --check

      - name: Check that the published data matches the registry and the feed
        run: node tools/build-data.mjs --check
