name: Appeal a listing
description: Ask for a listed domain, number or sender name to be reviewed and removed
title: "Appeal: "
labels: ["appeal", "urgent"]
body:
  - type: markdown
    attributes:
      value: |
        Target for a first response is 72 hours. If the evidence no longer supports the listing it is removed,
        and the removal is recorded with its reason. See APPEALS.md.
  - type: input
    id: value
    attributes:
      label: The listed domain, number or sender name
    validations:
      required: true
  - type: input
    id: relationship
    attributes:
      label: Your relationship to it
      placeholder: Owner, hosting provider, registrar, and so on
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the listing is wrong
      description: For example the domain changed hands, the content was removed, or it was never a scam.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Anything that supports this
